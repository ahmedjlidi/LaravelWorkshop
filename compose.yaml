name: laravel-capstone-workshop

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORKSHOP_PORT:-8080}:8000"
    environment:
      APP_NAME: Laravel Capstone Workshop
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://127.0.0.1:${WORKSHOP_PORT:-8080}"
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/workshop/database.sqlite
      DB_URL: ""
      SESSION_DRIVER: file
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
      FILESYSTEM_DISK: local
    volumes:
      - .:/app
      # Isolate host PHP dependencies, caches and data from the container.
      - vendor:/app/vendor
      - storage:/app/storage
      - bootstrap-cache:/app/bootstrap/cache
      - data:/var/workshop
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      start_period: 60s
      retries: 40

volumes:
  vendor:
  storage:
  bootstrap-cache:
  data:
